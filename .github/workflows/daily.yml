name: Daily cycle

# Start after the session cutoff (17:30 ET), with evening, overnight and morning retries.
# Crons are in UTC: GitHub ignored `timezone:` here and ran these as UTC times, so the
# "18:23 ET" attempt fired at 13:23 ET, before the close. ET = UTC-5 (EST) or UTC-4 (EDT).
# GitHub can delay cron jobs by hours: the first timely run freezes the forecast; later runs
# are no-ops. A missed next-open deadline fails visibly; it never shifts the forecast's target.
on:
  schedule:
    - cron: '40 22 * * 1-5'   # 17:40 EST / 18:40 EDT
    - cron: '40 23 * * 1-5'   # 18:40 EST / 19:40 EDT
    - cron: '10 1 * * 2-6'    # 20:10 EST / 21:10 EDT
    - cron: '10 4 * * 2-6'    # 23:10 EST / 00:10 EDT
    - cron: '10 8 * * *'      # 03:10 EST / 04:10 EDT
    - cron: '20 11 * * *'     # 06:20 EST / 07:20 EDT
    - cron: '50 12 * * *'     # 07:50 EST / 08:50 EDT
  workflow_dispatch:
    inputs:
      force:
        description: 'Freeze a snapshot even if one exists (never used for the live record)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: unpriced-state
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore data store
        run: bash ops/store.sh pull
      - name: Run the cycle
        id: run
        run: |
          set +e
          python -m unpriced.cli daily ${{ inputs.force && '--force' || '' }}
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "75" ]; then echo "::notice::Data for the last session is not complete yet; a later attempt will retry."; exit 0; fi
          exit $code
      - name: Verify the record
        id: verify
        if: always() && steps.run.outcome != 'skipped'
        run: python -m unpriced.cli verify --base HEAD
      - name: Save the record
        if: always() && steps.verify.outcome == 'success'
        run: bash ops/commit.sh "daily cycle $(date -u +%Y-%m-%dT%H:%MZ)"
      - name: Save the data store
        if: success() && steps.run.outputs.code == '0'
        run: bash ops/store.sh push
