name: Daily cycle

# Runs before the US open and processes the previous session. Three attempts each morning:
# the first that finds complete data freezes the forecast; later ones do nothing.
on:
  schedule:
    - cron: '10 6 * * *'
      timezone: 'America/New_York'
    - cron: '10 7 * * *'
      timezone: 'America/New_York'
    - cron: '20 8 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      force:
        description: 'Freeze a snapshot even if one exists (never used for the live record)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: unpriced-state
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore data store
        run: bash ops/store.sh pull
      - name: Run the cycle
        id: run
        run: |
          set +e
          python -m unpriced.cli daily ${{ inputs.force && '--force' || '' }}
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "75" ]; then echo "::notice::Data for the last session is not complete yet; a later attempt will retry."; exit 0; fi
          exit $code
      - name: Verify the record
        run: python -m unpriced.cli verify --base HEAD
      - name: Save the record
        if: always()
        run: bash ops/commit.sh "daily cycle $(date -u +%Y-%m-%dT%H:%MZ)"
      - name: Save the data store
        if: steps.run.outputs.code == '0'
        run: bash ops/store.sh push
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: steps.pages.outcome == 'success'
        continue-on-error: true
