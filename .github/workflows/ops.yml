name: Ops request

# A git-only control channel: commit a JSON file to ops/requests/ to run a job, e.g.
#   {"command": "bootstrap"}                      first full data download, then a first lab sweep
#   {"command": "weekly", "minutes": 120}
#   {"command": "sweep", "minutes": 60}
#   {"command": "daily"}
#   {"command": "site"}
#   {"command": "sec"}                            refresh SEC filings and fundamentals only
# The request moves to ops/done/ with the tail of the log, so whoever asked can read the result.
on:
  push:
    branches: [main]
    paths: ['ops/requests/**']
  workflow_dispatch:
    inputs:
      command:
        description: 'bootstrap | weekly | sweep | daily | site'
        default: bootstrap
      minutes:
        default: '150'

permissions:
  contents: write

concurrency:
  group: unpriced-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore data store
        run: bash ops/store.sh pull
      - name: Run requests
        id: run
        run: |
          set +e
          mkdir -p ops/done ops/requests
          reqs=$(ls ops/requests/*.json 2>/dev/null)
          if [ -z "$reqs" ] && [ -n "${{ inputs.command }}" ]; then
            echo '{"command": "${{ inputs.command }}", "minutes": ${{ inputs.minutes || 150 }}}' > ops/requests/dispatch.json
            reqs=ops/requests/dispatch.json
          fi
          status=0
          for f in $reqs; do
            cmd=$(python -c "import json,sys;print(json.load(open('$f'))['command'])")
            mins=$(python -c "import json,sys;print(json.load(open('$f')).get('minutes',150))")
            name=$(basename "$f" .json)
            log="ops/done/${name}.log"
            echo "== $f: $cmd ($mins min)"
            case "$cmd" in
              bootstrap) run="python -m unpriced.cli bootstrap && python -m unpriced.cli sweep --minutes $mins && python -m unpriced.cli site" ;;
              weekly)    run="python -m unpriced.cli weekly --minutes $mins" ;;
              sweep)     run="python -m unpriced.cli sweep --minutes $mins && python -m unpriced.cli site" ;;
              daily)     run="python -m unpriced.cli daily" ;;
              site)      run="python -m unpriced.cli site" ;;
              sec)       run="python -m unpriced.cli sec && python -m unpriced.cli site" ;;
              *)         run="echo unknown command $cmd; false" ;;
            esac
            set -o pipefail
            bash -c "$run" 2>&1 | tee "$log"
            code=${PIPESTATUS[0]}
            set +o pipefail
            [ $code -ne 0 ] && [ $code -ne 75 ] && status=$code
            tail -n 120 "$log" > "$log.tail" && mv "$log.tail" "$log"
            echo "exit: $code" >> "$log"
            git mv -f "$f" "ops/done/${name}.json" 2>/dev/null || mv "$f" "ops/done/${name}.json"
          done
          echo "code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify the record
        id: verify
        run: python -m unpriced.cli verify --base HEAD
      - name: Save the record
        run: bash ops/commit.sh "ops request $(date -u +%Y-%m-%dT%H:%MZ)"
      - name: Save the data store
        if: success() && steps.run.outputs.code == '0'
        run: bash ops/store.sh push
      - name: Fail if a request failed
        if: steps.run.outputs.code != '0'
        run: exit 1
