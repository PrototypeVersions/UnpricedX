name: CI

# Tests (including the look-ahead test) and integrity checks on every change.
# The integrity check fails if any append-only record was edited or any frozen
# forecast changed, so a pull request cannot quietly rewrite history.
on:
  push:
    branches: [main]
    paths-ignore: ['ops/requests/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q tests
      - name: Integrity of the live record
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE="origin/${{ github.base_ref }}"; else BASE="${{ github.event.before }}"; fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=""; fi
          python -m unpriced.cli verify ${BASE:+--base "$BASE"}
      - name: Offline end-to-end demo
        run: python -m unpriced.cli demo --stocks 120 --minutes 2 --days 8 > /tmp/demo.log 2>&1 || (tail -80 /tmp/demo.log; exit 1)
